[project]
name = "agent-skills"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=2.8.1",
    "pillow>=12.0.0",
    "pypdfium2>=5.13.0,<6",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "typer>=0.20.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.15.22", "ty>=0.0.61"]

[tool.ty.environment]
extra-paths = ["skills/translate-ja/scripts", "skills/translate-ja-v2/scripts"]
